<div class="diary-container">
  <div class="diary-main">
    <div class="diary-header">
      <h1 class="diary-title">学习日记</h1>
      <div class="diary-actions">
        <button class="btn-history" id="btn-history">历史记录</button>
        <button class="btn-save" id="btn-save">保存日记</button>
      </div>
    </div>
    <input type="text" class="diary-title-input" id="diary-title" placeholder="给今天的日记起个标题..." maxlength="100">
    <div class="diary-content" id="diary-content" contenteditable="true" placeholder="今天发生了什么？记录下你的学习点滴..."></div>
    <div class="diary-toolbar">
      <button class="btn-image" id="btn-image" title="插入图片">
        <span>📎</span>
        <span>插入图片</span>
      </button>
      <input type="file" id="image-file-input" accept="image/*" multiple hidden>
    </div>
    <div class="image-preview-list" id="image-preview-list"></div>
  </div>

  <aside class="diary-sidebar">
    <div class="sidebar-card">
      <h3 class="sidebar-title">今天的心情</h3>
      <div class="mood-grid" id="mood-grid"></div>
      <div class="mood-add" id="mood-add">没有合适的？点击添加自定义 →</div>
    </div>
    <div class="sidebar-card">
      <h3 class="sidebar-title">标签</h3>
      <div class="tag-list" id="tag-list"></div>
      <input type="text" class="tag-input" id="tag-input" placeholder="输入新标签..." maxlength="12">
    </div>
    <div class="sidebar-card">
      <h3 class="sidebar-title">本周心情</h3>
      <div class="weekly-grid" id="weekly-grid"></div>
      <div class="weekly-streak">连续记录 <span id="streak-count">0</span> 天，加油！</div>
    </div>
    <div class="sidebar-card">
      <h3 class="sidebar-title">字数统计</h3>
      <div class="word-count">
        <span class="word-count-number" id="char-count">0</span>
        <span class="word-count-unit">字</span>
      </div>
      <div class="word-count-hint" id="word-count-hint">开始记录吧，每一个字都算数</div>
    </div>
  </aside>
</div>

<!-- 历史记录弹窗 -->
<div class="modal-overlay" id="history-modal">
  <div class="modal-container">
    <div class="modal-header">
      <h3>历史记录</h3>
      <button class="modal-close" id="history-modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="history-filter">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="week">本周</button>
        <button class="filter-btn" data-filter="month">本月</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-container modal-small">
    <div class="modal-header">
      <h3>确认删除</h3>
      <button class="modal-close" id="delete-modal-close">✕</button>
    </div>
    <div class="modal-body">
      <p>确定要删除这篇日记吗？此操作不可撤销。</p>
      <p class="delete-target-title" id="delete-target-title"></p>
      <div class="modal-actions">
        <button class="btn-cancel" id="btn-cancel-delete">取消</button>
        <button class="btn-danger" id="btn-confirm-delete">删除</button>
      </div>
    </div>
  </div>
</div>

<!-- 未保存提示弹窗 -->
<div class="modal-overlay" id="unsaved-modal">
  <div class="modal-container modal-small">
    <div class="modal-header">
      <h3>有未保存的内容</h3>
      <button class="modal-close" id="unsaved-modal-close">✕</button>
    </div>
    <div class="modal-body">
      <p>当前编辑的内容尚未保存，确定要离开吗？</p>
      <div class="modal-actions">
        <button class="btn-cancel" id="btn-continue-edit">继续编辑</button>
        <button class="btn-danger" id="btn-discard-edit">放弃修改</button>
      </div>
    </div>
  </div>
</div>

<!-- 自定义心情弹窗 -->
<div class="modal-overlay" id="custom-mood-modal">
  <div class="modal-container modal-large">
    <div class="modal-header">
      <h3>添加自定义心情</h3>
      <button class="modal-close" id="custom-mood-close">✕</button>
    </div>
    <div class="modal-body modal-scrollable">
      <div class="custom-mood-emoji-section">
        <label>选择表情（点击选中）</label>
        <div class="emoji-grid-scrollable" id="emoji-grid"></div>
      </div>
      <div class="custom-mood-name-section">
        <label>心情名称</label>
        <input type="text" id="custom-mood-name" placeholder="如：超棒" maxlength="10">
      </div>
      <div class="custom-mood-level-section">
        <label>心情等级（1-10）</label>
        <div class="value-slider">
          <input type="range" id="custom-mood-level" min="1" max="10" value="5">
          <span class="value-display" id="custom-mood-level-display">5</span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="btn-cancel-custom-mood">取消</button>
      <button class="btn-primary" id="btn-confirm-custom-mood">添加</button>
    </div>
  </div>
</div>

<!-- 图片 Lightbox -->
<div class="lightbox-overlay" id="lightbox-overlay">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
</div>

<!-- Toast -->
<div class="diary-toast" id="diary-toast"></div>
