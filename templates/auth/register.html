<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5BBFAA">
    <title>注册 - StudyPal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint: #5BBFAA;
            --mint-light: #7DD4C2;
            --mint-dark: #4AA894;
            --mint-ghost: rgba(91, 191, 170, 0.15);
            --coral: #FF8C69;
            --sky: #6BAED6;
            --dusk: #B39BC8;
            --bg: #F4F8FA;
            --bg-card: #FFFFFF;
            --bg-soft: #E8F0F2;
            --bg-mist: #EEF4F6;
            --ink: #1E2A33;
            --ink-light: #3D4F5C;
            --ink-muted: #6B7E8D;
            --ink-faint: #9AACBA;
            --border: rgba(91, 191, 170, 0.1);
            --border-light: rgba(91, 191, 170, 0.06);
            --shadow-card: 0 2px 8px rgba(30, 42, 51, 0.06), 0 8px 24px rgba(30, 42, 51, 0.08);
            --shadow-float: 0 4px 16px rgba(30, 42, 51, 0.1), 0 16px 40px rgba(30, 42, 51, 0.1);
            --font: 'Nunito', 'Noto Sans SC', -apple-system, sans-serif;
            --text-md: 15px;
            --text-lg: 17px;
            --text-xl: 20px;
            --text-3xl: 30px;
            --text-sm: 13px;
            --text-xs: 11px;
            --font-normal: 400;
            --font-medium: 500;
            --font-semibold: 600;
            --font-bold: 700;
            --border-radius-sm: 12px;
            --border-radius-md: 16px;
            --border-radius-lg: 20px;
            --border-radius-xl: 28px;
            --border-radius-pill: 999px;
            --gap-2: 8px;
            --gap-3: 12px;
            --gap-4: 16px;
            --gap-5: 20px;
            --gap-6: 24px;
            --gap-8: 32px;
            --gap-10: 40px;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --duration-fast: 150ms;
            --duration-normal: 250ms;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }
        body {
            font-family: var(--font);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--ink);
        }
        .reg-wrap {
            width: 100%;
            max-width: 380px;
            animation: slideUp 0.5s var(--ease-out);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reg-logo {
            text-align: center;
            margin-bottom: var(--gap-8);
        }
        .reg-logo-icon {
            font-size: 64px;
            display: block;
            margin-bottom: var(--gap-4);
        }
        .reg-logo-title {
            font-size: var(--text-3xl);
            font-weight: var(--font-bold);
            color: var(--ink);
        }
        .reg-logo-sub {
            font-size: var(--text-sm);
            color: var(--ink-muted);
            margin-top: var(--gap-2);
        }
        .reg-card {
            background: var(--bg-card);
            border-radius: var(--border-radius-xl);
            box-shadow: var(--shadow-float);
            padding: var(--gap-8) var(--gap-6);
        }
        .reg-title {
            font-size: var(--text-xl);
            font-weight: var(--font-bold);
            color: var(--ink);
            margin-bottom: var(--gap-6);
            text-align: center;
        }
        .input-group { margin-bottom: var(--gap-4); }
        .input-label {
            display: block;
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--ink-light);
            margin-bottom: var(--gap-2);
        }
        .input {
            width: 100%;
            padding: var(--gap-3) var(--gap-4);
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: var(--border-radius-md);
            font-size: var(--text-md);
            font-family: var(--font);
            color: var(--ink);
            transition: border-color var(--duration-fast) var(--ease-out),
                        box-shadow var(--duration-fast) var(--ease-out);
            outline: none;
        }
        .input:focus {
            border-color: var(--mint);
            box-shadow: 0 0 0 3px var(--mint-ghost);
        }
        .input::placeholder { color: var(--ink-faint); }
        .btn-primary {
            width: 100%;
            padding: var(--gap-4);
            background: var(--mint);
            color: white;
            border: none;
            border-radius: var(--border-radius-pill);
            font-size: var(--text-md);
            font-weight: var(--font-semibold);
            font-family: var(--font);
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(91, 191, 170, 0.35);
            transition: all var(--duration-fast) var(--ease-out);
            margin-top: var(--gap-6);
        }
        .btn-primary:hover {
            background: var(--mint-dark);
            box-shadow: 0 6px 20px rgba(91, 191, 170, 0.4);
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: scale(0.98) translateY(0); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-msg {
            background: rgba(255, 140, 105, 0.1);
            color: var(--coral);
            padding: var(--gap-3) var(--gap-4);
            border-radius: var(--border-radius-md);
            font-size: var(--text-sm);
            margin-bottom: var(--gap-4);
            display: none;
            text-align: center;
            border: 1px solid rgba(255, 140, 105, 0.2);
        }
        .error-msg.show { display: block; }
        .reg-footer {
            text-align: center;
            margin-top: var(--gap-6);
            font-size: var(--text-sm);
            color: var(--ink-muted);
        }
        .reg-footer a {
            color: var(--mint);
            font-weight: var(--font-semibold);
            text-decoration: none;
        }
        .reg-footer a:hover { color: var(--mint-dark); }
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: var(--gap-3);
            margin-bottom: var(--gap-6);
        }
        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--bg-soft);
            transition: all var(--duration-normal) var(--ease-out);
        }
        .step-dot.active {
            background: var(--mint);
            width: 24px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="reg-wrap">
        <div class="reg-logo">
            <span class="reg-logo-icon">&#128218;</span>
            <h1 class="reg-logo-title">StudyPal</h1>
            <p class="reg-logo-sub">开启你的考研之旅</p>
        </div>

        <div class="reg-card">
            <h2 class="reg-title">创建账号</h2>

            <div class="error-msg" id="error-msg"></div>

            <form id="reg-form">
                <div class="input-group">
                    <label class="input-label">昵称</label>
                    <input type="text" id="nickname" class="input" placeholder="给自己起个昵称" required>
                </div>

                <div class="input-group">
                    <label class="input-label">邮箱地址</label>
                    <input type="email" id="email" class="input" placeholder="your@email.com" required autocomplete="email">
                </div>

                <div class="input-group">
                    <label class="input-label">密码</label>
                    <input type="password" id="password" class="input" placeholder="至少6位" required minlength="6">
                </div>

                <div class="input-group">
                    <label class="input-label">确认密码</label>
                    <input type="password" id="confirm-password" class="input" placeholder="再输一次" required>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">
                    注册
                </button>
            </form>

            <div class="reg-footer">
                已有账号？<a href="/login">立即登录</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('reg-form');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
        }

        function hideError() {
            errorMsg.classList.remove('show');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const nickname = document.getElementById('nickname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!nickname || !email || !password) {
                showError('请填写完整信息');
                return;
            }

            if (password !== confirmPassword) {
                showError('两次密码输入不一致');
                return;
            }

            if (password.length < 6) {
                showError('密码至少6位');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '注册中...';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname, email, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    submitBtn.textContent = '注册成功！';
                    setTimeout(() => window.location.href = '/', 400);
                } else {
                    showError(data.error || '注册失败');
                    submitBtn.textContent = '注册';
                }
            } catch (err) {
                showError('网络连接失败，请检查网络后重试');
                submitBtn.textContent = '注册';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
