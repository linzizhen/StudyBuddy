<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#10b981">
    <title>StudyPal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310b981'/%3E%3Cpath d='M9 16L14 21L23 12' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
        :root {
            --mint: #10b981;
            --mint-light: #34d399;
            --mint-dark: #059669;
            --mint-ghost: rgba(16, 185, 129, 0.15);
            --mint-subtle: rgba(16, 185, 129, 0.07);
            --coral: #FF8C69;
            --coral-ghost: rgba(255, 140, 105, 0.12);
            --sky: #6BAED6;
            --dusk: #B39BC8;
            --sunny: #FFD166;
            --bg: #F4F8FA;
            --text: #1E2A33;
            --text-muted: #6B7E8D;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        }

        [data-theme="dark"] {
            --bg: #1A1D23;
            --text: #E8EDF1;
            --text-muted: #8898A6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
        }

        .splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: none;
        }

        .splash-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                145deg,
                #F0FAF8 0%,
                #E8F6F3 25%,
                #F4F8FA 50%,
                #F8FBFD 75%,
                #FFFFFF 100%
            );
            opacity: 0;
            animation: splashBgIn 600ms var(--ease-out) forwards;
        }

        @keyframes splashBgIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .splash-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
        }

        .splash-orb-1 {
            width: 300px;
            height: 300px;
            top: 10%;
            left: -80px;
            background: rgba(16, 185, 129, 0.15);
            opacity: 0;
            animation: orbFloat1 3s ease-in-out infinite, orbFadeIn 800ms 100ms var(--ease-out) forwards;
        }

        .splash-orb-2 {
            width: 220px;
            height: 220px;
            bottom: 20%;
            right: -60px;
            background: rgba(255, 140, 105, 0.1);
            opacity: 0;
            animation: orbFloat2 3.5s ease-in-out infinite, orbFadeIn 800ms 200ms var(--ease-out) forwards;
        }

        .splash-orb-3 {
            width: 180px;
            height: 180px;
            top: 30%;
            right: 15%;
            background: rgba(107, 174, 214, 0.08);
            opacity: 0;
            animation: orbFloat3 4s ease-in-out infinite, orbFadeIn 800ms 300ms var(--ease-out) forwards;
        }

        @keyframes orbFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%       { transform: translate(15px, -20px) scale(1.05); }
        }

        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%       { transform: translate(-10px, 15px) scale(1.08); }
        }

        @keyframes orbFloat3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%       { transform: translate(8px, 12px) scale(1.03); }
        }

        .splash-logo-wrap {
            position: relative;
            z-index: 10;
            margin-bottom: 32px;
        }

        .splash-logo-ring {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 2px solid rgba(16, 185, 129, 0.15);
            opacity: 0;
            animation: ringExpand 600ms 400ms var(--ease-out) forwards;
        }

        .splash-logo-ring-2 {
            position: absolute;
            inset: -24px;
            border-radius: 50%;
            border: 1.5px solid rgba(16, 185, 129, 0.08);
            opacity: 0;
            animation: ringExpand 600ms 600ms var(--ease-out) forwards;
        }

        @keyframes ringExpand {
            from { opacity: 0; transform: scale(0.6); }
            to   { opacity: 1; transform: scale(1); }
        }

        .splash-logo {
            width: 88px;
            height: 88px;
            border-radius: 24px;
            background: linear-gradient(145deg, var(--mint), var(--mint-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 8px 32px rgba(16, 185, 129, 0.28),
                0 2px 8px rgba(16, 185, 129, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            opacity: 0;
            transform: scale(0.4) translateY(20px);
            animation: logoAppear 700ms 200ms var(--ease-out) forwards;
        }

        @keyframes logoAppear {
            0%   { opacity: 0; transform: scale(0.4) translateY(20px); }
            60%  { opacity: 1; transform: scale(1.08) translateY(-3px); }
            80%  { transform: scale(0.97) translateY(1px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .splash-logo svg { width: 44px; height: 44px; }

        .splash-brand {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(12px);
            animation: brandFadeIn 600ms 500ms var(--ease-out) forwards;
        }

        .splash-brand span { color: var(--mint); }

        @keyframes brandFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .splash-tagline {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            margin-bottom: 48px;
            opacity: 0;
            transform: translateY(8px);
            animation: brandFadeIn 600ms 650ms var(--ease-out) forwards;
        }

        .splash-buddies {
            display: flex;
            gap: 16px;
            margin-bottom: 48px;
            opacity: 0;
            animation: buddiesSlideIn 700ms 800ms var(--ease-out) forwards;
        }

        @keyframes buddiesSlideIn {
            from { opacity: 0; transform: translateY(24px) scale(0.9); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .splash-buddy {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            opacity: 0;
            transform: translateY(16px);
            animation: buddyPop 500ms var(--ease-out) forwards;
        }

        .splash-buddy:nth-child(1) { background: linear-gradient(135deg, #FDE68A, #FCD34D); animation-delay: 900ms; }
        .splash-buddy:nth-child(2) { background: linear-gradient(135deg, #FEE2E2, #FCA5A5); animation-delay: 1000ms; }
        .splash-buddy:nth-child(3) { background: linear-gradient(135deg, #E0E7FF, #A5B4FC); animation-delay: 1100ms; }
        .splash-buddy:nth-child(4) { background: linear-gradient(135deg, #CFFAFE, #67E8F9); animation-delay: 1200ms; }
        .splash-buddy:nth-child(5) { background: linear-gradient(135deg, #F3E8FF, #D8B4FE); animation-delay: 1300ms; }
        .splash-buddy:nth-child(6) { background: linear-gradient(135deg, #D1FAE5, #6EE7B7); animation-delay: 1400ms; }

        @keyframes buddyPop {
            0%   { opacity: 0; transform: translateY(16px) scale(0.7); }
            70%  { transform: translateY(-4px) scale(1.1); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .splash-progress-wrap {
            width: 160px;
            height: 4px;
            background: rgba(16, 185, 129, 0.12);
            border-radius: 999px;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 400ms 1200ms var(--ease-out) forwards;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .splash-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--mint), var(--mint-light));
            border-radius: 999px;
            width: 0%;
            animation: progressLoad 1.5s 1.5s var(--ease-out) forwards;
        }

        @keyframes progressLoad {
            0%   { width: 0%; }
            30%  { width: 60%; }
            60%  { width: 80%; }
            100% { width: 100%; }
        }

        .splash-footer {
            position: absolute;
            bottom: 48px;
            font-size: 11px;
            color: var(--text-muted);
            opacity: 0;
            letter-spacing: 0.5px;
            animation: fadeIn 600ms 1600ms var(--ease-out) forwards;
        }

        .splash-footer span { margin: 0 6px; opacity: 0.5; }

        .splash.exiting .splash-bg { animation: splashBgOut 600ms 200ms var(--ease-out) forwards; }
        .splash.exiting .splash-logo-wrap,
        .splash.exiting .splash-brand,
        .splash.exiting .splash-tagline,
        .splash.exiting .splash-buddies,
        .splash.exiting .splash-footer { animation: splashFadeOut 400ms var(--ease-out) forwards; }
        .splash.exiting .splash-progress-wrap { animation: progressFadeOut 300ms var(--ease-out) forwards; }
        .splash.exiting .splash-logo { animation: logoExit 400ms var(--ease-out) forwards; }

        @keyframes splashBgOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes splashFadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-8px); } }
        @keyframes progressFadeOut { from { opacity: 1; transform: scaleX(1); } to { opacity: 0; transform: scaleX(0.8); } }
        @keyframes logoExit { 0% { opacity: 1; transform: scale(1) rotate(0deg); } 100% { opacity: 0; transform: scale(0.6) rotate(10deg); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
            .splash-bg { opacity: 1; }
            .splash-logo { opacity: 1; transform: none; }
            .splash-brand, .splash-tagline { opacity: 1; transform: none; }
            .splash-buddies { opacity: 1; }
            .splash-buddy { opacity: 1; }
            .splash-progress-wrap { opacity: 1; }
            .splash-progress-bar { width: 100%; }
            .splash-footer { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="splash" id="splash">
        <div class="splash-bg"></div>
        <div class="splash-orb splash-orb-1"></div>
        <div class="splash-orb splash-orb-2"></div>
        <div class="splash-orb splash-orb-3"></div>

        <div class="splash-logo-wrap">
            <div class="splash-logo-ring"></div>
            <div class="splash-logo-ring-2"></div>
            <div class="splash-logo">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 24L20 32L36 16" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <div class="splash-brand">你的专属 <span>学习搭子</span></div>
        <div class="splash-tagline">学习路上，你从来不是一个人</div>

        <div class="splash-buddies">
            <div class="splash-buddy">&#128150;</div>
            <div class="splash-buddy">&#128293;</div>
            <div class="splash-buddy">&#128218;</div>
            <div class="splash-buddy">&#127769;</div>
            <div class="splash-buddy">&#127814;</div>
            <div class="splash-buddy">&#129302;</div>
        </div>

        <div class="splash-progress-wrap">
            <div class="splash-progress-bar"></div>
        </div>

        <div class="splash-footer">
            StudyPal <span>&bull;</span> 让每一次学习都有人陪
        </div>
    </div>

    <script>
        (function() {
            var splash = document.getElementById('splash');
            var totalDuration = 2000;

            function exitSplash() {
                if (splash) {
                    splash.classList.add('exiting');
                    setTimeout(function() {
                        splash.style.display = 'none';
                        window.location.href = '/app';
                    }, 400);
                }
            }

            setTimeout(exitSplash, totalDuration);

            window.addEventListener('app-ready', function() {
                var elapsed = Date.now() - window.__splashStartTime;
                if (elapsed >= 1500) {
                    exitSplash();
                } else {
                    setTimeout(exitSplash, Math.max(0, 1500 - elapsed));
                }
            });

            window.__splashStartTime = Date.now();
        })();
    </script>
</body>
</html>
