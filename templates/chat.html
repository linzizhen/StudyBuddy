<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#00D9B1">
    <title>搭话 - StudyPal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
        (function() {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = 'https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap';
            var n = document.querySelector('link[rel="stylesheet"]');
            n.parentNode.insertBefore(l, n);
        })();
    </script>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body>

    <!-- ========== 聊天容器 ========== -->
    <div class="chat-layout">

        <!-- ====== 侧边栏 ====== -->
        <aside class="chat-sidebar" id="chat-sidebar">
            <!-- Logo -->
            <div class="sidebar-logo">
                <div class="logo-icon">&#128150;</div>
                <div class="logo-text">StudyPal</div>
            </div>

            <!-- 新建会话 -->
            <button class="new-chat-btn" id="new-chat-btn" onclick="App.newChat()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                新建会话
            </button>

            <!-- 历史会话 -->
            <div class="history-list" id="history-list">
                <div class="history-date-label">今天</div>
                <div class="history-item active" onclick="App.loadChat('default')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    当前会话
                </div>
            </div>

            <!-- 侧边栏底部 -->
            <div class="sidebar-footer">
                <button class="sidebar-btn" onclick="App.navigate('home')" title="返回首页">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    首页
                </button>
                <button class="sidebar-btn" onclick="App.navigate('settings')" title="设置">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    设置
                </button>
                <button class="sidebar-btn" onclick="App.switchRole()" title="切换搭子">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    切换搭子
                </button>
            </div>
        </aside>

        <!-- 移动端侧边栏遮罩 -->
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="App.toggleSidebar()"></div>

        <!-- ====== 主聊天区域 ====== -->
        <main class="chat-main">

            <!-- 移动端顶部栏 -->
            <div class="chat-mobile-header">
                <button class="mobile-menu-btn" onclick="App.toggleSidebar()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="mobile-header-info" id="mobile-header-info">
                    <span class="mobile-avatar" id="chat-buddy-avatar">&#128150;</span>
                    <span id="chat-buddy-name">小豆</span>
                </div>
                <button class="mobile-switch-btn" onclick="App.switchRole()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </button>
            </div>

            <!-- 搭子信息栏 -->
            <div class="buddy-info-bar" id="buddy-info-bar">
                <div class="buddy-avatar-lg" id="chat-buddy-avatar-2">&#128150;</div>
                <div class="buddy-info-content">
                    <div class="buddy-name" id="chat-buddy-name-2">小豆</div>
                    <div class="buddy-status">
                        <span class="status-dot online" id="buddy-status-dot"></span>
                        <span id="buddy-status-text">随时待命</span>
                    </div>
                </div>
                <div class="model-badge" id="chat-model-badge"></div>
                <button class="buddy-action-btn" onclick="App.switchRole()" title="切换搭子">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </button>
            </div>

            <!-- 消息区域 -->
            <div class="messages-container" id="chat-messages">
                <!-- 空状态 -->
                <div class="chat-empty-state" id="chat-empty">
                    <div class="empty-avatar" id="ds-empty-avatar">&#128150;</div>
                    <div class="empty-name" id="ds-empty-name">小豆</div>
                    <div class="empty-tagline">我是你的学习搭子，随时陪你聊聊学习和生活</div>
                    <div class="suggestion-chips" id="chat-suggestions"></div>
                </div>

                <!-- 未配置模型引导 -->
                <div class="model-guide-card" id="chat-model-guide">
                    <div class="guide-icon">&#9888;</div>
                    <div class="guide-title">搭子暂时离线</div>
                    <div class="guide-desc">需要先配置 AI 模型，搭子才能上线陪你聊天</div>
                    <div class="guide-steps">
                        <div class="guide-step">
                            <span class="step-num">1</span>
                            <span>打开设置页面</span>
                        </div>
                        <div class="guide-step">
                            <span class="step-num">2</span>
                            <span>找到「AI 模型配置」</span>
                        </div>
                        <div class="guide-step">
                            <span class="step-num">3</span>
                            <span>填写 API 地址和 Key</span>
                        </div>
                    </div>
                    <button class="guide-btn" onclick="openModelGuide()">
                        &#9889; 立即配置 AI 模型
                    </button>
                    <div class="guide-hint">
                        推荐使用 <strong>Groq</strong>（免费）或 <strong>DeepSeek</strong>（便宜）
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea
                        class="chat-input"
                        id="chat-input"
                        placeholder="输入消息..."
                        rows="1"
                        autocomplete="off"
                    ></textarea>
                    <button class="send-btn" id="btn-send" onclick="App.sendChat()">
                        <svg class="send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                        <svg class="send-spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <circle cx="12" cy="12" r="10" stroke-opacity="0.3"></circle>
                            <path d="M12 2a10 10 0 0 1 10 10"></path>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">搭子由 AI 驱动，内容仅供参考</div>
            </div>

        </main>

    </div>

    <!-- ===== 角色选择弹窗 ===== -->
    <div class="modal-overlay" id="role-modal">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <div class="modal-title">&#128149; 切换学习搭子</div>
                <button class="modal-close-btn" onclick="App.closeRoleModal()">&#10005;</button>
            </div>
            <div class="modal-body">
                <div id="role-list" class="role-list"></div>
            </div>
        </div>
    </div>

    <!-- ===== 模型配置弹窗 ===== -->
    <div class="modal-overlay" id="chat-model-modal">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <div class="modal-title">&#9889; AI 模型配置</div>
                <button class="modal-close-btn" onclick="App.closeChatModelModal()">&#10005;</button>
            </div>
            <div class="modal-body">
                <div class="model-guide-intro">
                    搭子需要 AI 模型才能工作，推荐使用以下免费或便宜的模型：
                </div>
                <div class="model-presets" id="chat-model-presets"></div>
                <div class="modal-divider">或自定义配置</div>
                <div class="input-group">
                    <label class="input-label">配置名称（选填）</label>
                    <input type="text" class="input" id="chat-custom-model-name" placeholder="我的 DeepSeek">
                </div>
                <div class="input-group">
                    <label class="input-label">API 地址 <span style="color:var(--coral);">*</span></label>
                    <input type="text" class="input" id="chat-custom-model-url" placeholder="https://api.deepseek.com/v1">
                </div>
                <div class="input-group">
                    <label class="input-label">API Key <span style="color:var(--coral);">*</span></label>
                    <input type="password" class="input" id="chat-custom-model-key" placeholder="sk-xxxxxxxxxxxxxxxx">
                </div>
                <div class="input-group">
                    <label class="input-label">模型名称 <span style="color:var(--coral);">*</span></label>
                    <input type="text" class="input" id="chat-custom-model-name2" placeholder="deepseek-chat">
                </div>
                <button class="btn btn-secondary btn-block" id="chat-test-model-btn" onclick="App.testChatModel()">&#128270; 测试连接</button>
                <div id="chat-test-result" class="model-test-result"></div>
                <button class="btn btn-primary btn-block" id="chat-save-model-btn" onclick="App.saveChatModel()">&#128190; 保存并开始聊天</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/static/js/constants.js" defer></script>
    <script src="/static/js/api.js" defer></script>
    <script src="/static/js/state.js" defer></script>
    <script src="/static/js/app.js" defer></script>
    <script>
    (function() {
        if (!localStorage.getItem('token')) {
            window.location.href = '/login';
            return;
        }
        var theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);

        var tryInit = function() {
            if (window.App) {
                window.App._isSPA = false;
                window.App.token = localStorage.getItem('token');
                window.App.user = JSON.parse(localStorage.getItem('user') || 'null');
                if (window.App.applyTheme) window.App.applyTheme(theme);
                _loadChatBuddyData();
                if (window.App.initChat) window.App.initChat();
            } else {
                setTimeout(tryInit, 30);
            }
        };
        tryInit();

        document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    overlay.classList.remove('show');
                    document.body.style.overflow = '';
                }
            });
        });

        if (window.PageInit && PageInit.chat) PageInit.chat();
    })();

    async function _loadChatBuddyData() {
        var App = window.App;
        if (!App || !App.token) return;
        try {
            var res = await fetch('/api/buddy/status', {
                headers: { 'Authorization': 'Bearer ' + App.token }
            });
            var data = await res.json();
            if (data.success) {
                App.data.buddy = data.status;
                if (window.App.renderBuddy) window.App.renderBuddy();
                if (window.App._setBuddyStatus) {
                    var emotionText = data.status?.emotion_desc || '随时待命';
                    window.App._setBuddyStatus('online', emotionText);
                }
            }
            await _checkModelConfig();
        } catch (e) {
            console.error('加载搭子数据失败', e);
        }
    }

    async function _checkModelConfig() {
        var App = window.App;
        if (!App || !App.token) return;
        try {
            var res = await fetch('/api/ai-model/status', {
                headers: { 'Authorization': 'Bearer ' + App.token }
            });
            var data = await res.json();
            var guide = document.getElementById('chat-model-guide');
            var empty = document.getElementById('chat-empty');
            if (!guide || !empty) return;
            if (data.success && !data.configured) {
                guide.classList.add('visible');
                empty.style.display = 'none';
                if (window.App._setBuddyStatus) window.App._setBuddyStatus('error', '未配置模型');
            } else {
                guide.classList.remove('visible');
                empty.style.display = '';
            }
        } catch (e) {
            console.error('[模型检测] 失败:', e);
        }
    }

    function openModelGuide() {
        window.App.openModelModal();
    }
    </script>
</body>
</html>
