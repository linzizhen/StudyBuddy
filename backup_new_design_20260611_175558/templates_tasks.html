<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5BBFAA">
    <title>任务 - StudyPal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
        (function() {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = 'https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap';
            var n = document.querySelector('link[rel="stylesheet"]');
            n.parentNode.insertBefore(l, n);
        })();
    </script>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/animate.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

    <header class="top-bar">
        <div class="top-bar-left">
            <div>
                <div class="top-bar-greeting" id="top-greeting">你好</div>
                <div class="top-bar-date" id="top-date"></div>
            </div>
        </div>
        <div class="top-bar-right">
            <button class="btn-icon" onclick="window.location.href='/settings'" title="设置">&#9881;</button>
        </div>
    </header>

    <main class="app-main">
        <div class="tasks-layout">

            <!-- ===== 页面标题 ===== -->
            <div class="tasks-page-header">
                <div class="tasks-page-title">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--mint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                    待办事项
                </div>
                <div class="tasks-header-right">
                    <div class="tasks-summary-chip">
                        <span id="tasks-pending-count">0</span> 待完成
                    </div>
                </div>
            </div>

            <!-- ===== 筛选标签 ===== -->
            <div class="tasks-filter-bar">
                <div class="tasks-filter-tabs" id="task-filter-tabs">
                    <button class="tasks-filter-tab active" data-filter="all">
                        全部
                    </button>
                    <button class="tasks-filter-tab" data-filter="pending">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                        </svg>
                        待完成
                    </button>
                    <button class="tasks-filter-tab" data-filter="completed">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        已完成
                    </button>
                </div>
            </div>

            <!-- ===== 任务列表 ===== -->
            <div class="tasks-list-section">
                <div id="task-list" class="tasks-list"></div>
            </div>

            <!-- ===== 添加任务按钮 ===== -->
            <div class="tasks-add-section">
                <button class="tasks-add-btn" onclick="App.showAddTask()">
                    <div class="tasks-add-btn-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </div>
                    <span>添加新任务</span>
                </button>
            </div>

        </div>
    </main>

    <nav class="bottom-nav">
        <a class="nav-item" href="/home">
            <span class="nav-item-icon">&#127968;</span>
            <span class="nav-item-label">首页</span>
        </a>
        <a class="nav-item" href="/chat">
            <span class="nav-item-icon">&#128172;</span>
            <span class="nav-item-label">搭话</span>
        </a>
        <a class="nav-item" href="/diary">
            <span class="nav-item-icon">&#128221;</span>
            <span class="nav-item-label">日记</span>
        </a>
        <a class="nav-item active" href="/tasks">
            <span class="nav-item-icon">&#9745;</span>
            <span class="nav-item-label">任务</span>
        </a>
        <a class="nav-item" href="/settings">
            <span class="nav-item-icon">&#9881;</span>
            <span class="nav-item-label">设置</span>
        </a>
    </nav>

    <div class="toast" id="toast"></div>

    <script src="/static/js/constants.js" defer></script>
    <script src="/static/js/api.js" defer></script>
    <script src="/static/js/state.js" defer></script>
    <script src="/static/js/app.js" defer></script>
    <script>
    (function() {
        if (!localStorage.getItem('token')) {
            window.location.href = '/login';
            return;
        }
        var tryInit = function() {
            if (window.App) {
                window.App._isSPA = false;
                window.App.token = localStorage.getItem('token');
                window.App.user = JSON.parse(localStorage.getItem('user') || 'null');
                window.App.applyTheme(localStorage.getItem('theme') || 'light');
                window.App.initTasks();
                window.App.initSettings();
                window.App.initBuddyDesigner();
                _loadTasksData(window.App);
            } else {
                setTimeout(tryInit, 30);
            }
        };
        tryInit();

        document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    overlay.classList.remove('show');
                    document.body.style.overflow = '';
                }
            });
        });
    })();

    async function _loadTasksData(App) {
        try {
            var res = await fetch('/api/auth/me', {
                headers: { 'Authorization': 'Bearer ' + App.token }
            });
            var data = await res.json();
            if (data.success) {
                App.user = data.user;
                localStorage.setItem('user', JSON.stringify(data.user));
            }
        } catch(e) {}
    }
    </script>
</body>
</html>
