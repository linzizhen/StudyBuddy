<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FF9A9E">
    <title>日记 - StudyPal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
        (function() {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = 'https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap';
            var n = document.querySelector('link[rel="stylesheet"]');
            n.parentNode.insertBefore(l, n);
        })();
    </script>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/diary.css">
</head>
<body>

    <header class="top-bar">
        <div class="top-bar-left">
            <div>
                <div class="top-bar-greeting" id="top-greeting">你好</div>
                <div class="top-bar-date" id="top-date"></div>
            </div>
        </div>
        <div class="top-bar-right">
            <button class="btn-icon" onclick="window.location.href='/settings'" title="设置">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="diary-page">
        <div class="diary-container">

            <!-- ===== 头部：日期 + 连续天数 ===== -->
            <section class="diary-hero animate-slideUp">
                <div class="diary-date-wrap">
                    <div class="diary-current-date" id="diary-current-date">2026年6月11日</div>
                    <div class="diary-current-weekday" id="diary-current-weekday">星期四</div>
                </div>
                <div class="diary-streak-badge" id="diary-streak">
                    <span class="streak-fire">&#128293;</span>
                    <span class="streak-text">连续 <span id="streak-count">0</span> 天</span>
                </div>
            </section>

            <!-- ===== 心情选择 ===== -->
            <section class="mood-section card animate-slideUp" style="animation-delay: 50ms">
                <div class="mood-header">
                    <span class="mood-title">今天心情如何？</span>
                </div>
                <div class="mood-track" id="mood-track">
                    <!-- 动态生成 -->
                </div>
            </section>

            <!-- ===== 快速记录卡片 ===== -->
            <section class="diary-editor-card card animate-slideUp" style="animation-delay: 100ms">
                <div class="editor-quick-prompt" id="editor-prompt">
                    今天想记录什么...
                </div>

                <div class="editor-form">
                    <!-- 标题 -->
                    <div class="editor-field">
                        <input type="text" class="title-input" id="diary-title" placeholder="标题（选填）" maxlength="100">
                    </div>

                    <!-- 内容 -->
                    <div class="editor-field">
                        <textarea class="content-textarea" id="diary-content" placeholder="写下此刻的想法..." rows="4"></textarea>
                        <div class="word-count-bar">
                            <span class="char-count" id="char-count">0</span> 字
                        </div>
                    </div>

                    <!-- 标签 -->
                    <div class="editor-field">
                        <div class="tag-cloud" id="tag-cloud">
                            <!-- 动态生成 -->
                        </div>
                    </div>

                    <!-- 底部工具栏 -->
                    <div class="editor-toolbar">
                        <div class="toolbar-left">
                            <button class="tool-btn" id="weather-btn" title="天气">
                                <span id="selected-weather">&#9728;</span>
                            </button>
                            <button class="tool-btn" id="image-btn" title="添加图片">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                            </button>
                        </div>
                        <button class="save-btn" id="save-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            <span>保存</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- ===== 历史日记 ===== -->
            <section class="history-section animate-slideUp" style="animation-delay: 150ms">
                <div class="history-header">
                    <h2 class="history-title">过往日记</h2>
                    <span class="history-count" id="diary-count">0 篇</span>
                </div>

                <!-- 搜索和筛选 -->
                <div class="filter-bar">
                    <div class="search-wrap">
                        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" class="search-input" id="search-input" placeholder="搜索日记...">
                    </div>
                    <button class="filter-toggle-btn" id="filter-toggle">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                        </svg>
                    </button>
                </div>

                <!-- 筛选面板 -->
                <div class="filter-panel" id="filter-panel">
                    <div class="filter-group">
                        <div class="filter-label">按心情</div>
                        <div class="filter-chips" id="filter-emotions">
                            <!-- 动态生成 -->
                        </div>
                    </div>
                    <div class="filter-group">
                        <div class="filter-label">按标签</div>
                        <div class="filter-chips" id="filter-tags">
                            <!-- 动态生成 -->
                        </div>
                    </div>
                </div>

                <!-- 日记卡片流 -->
                <div class="diary-stream" id="diary-stream">
                    <!-- 动态生成 -->
                </div>

                <!-- 加载更多 -->
                <div class="load-more-wrap" id="load-more" style="display:none;">
                    <button class="load-more-btn" id="load-more-btn">加载更多</button>
                </div>
            </section>

        </div>
    </main>

    <nav class="bottom-nav">
        <a class="nav-item" href="/home">
            <span class="nav-item-icon">&#127968;</span>
            <span class="nav-item-label">首页</span>
        </a>
        <a class="nav-item" href="/chat">
            <span class="nav-item-icon">&#128172;</span>
            <span class="nav-item-label">搭话</span>
        </a>
        <a class="nav-item active" href="/diary">
            <span class="nav-item-icon">&#128221;</span>
            <span class="nav-item-label">日记</span>
        </a>
        <a class="nav-item" href="/tasks">
            <span class="nav-item-icon">&#9745;</span>
            <span class="nav-item-label">任务</span>
        </a>
        <a class="nav-item" href="/settings">
            <span class="nav-item-icon">&#9881;</span>
            <span class="nav-item-label">设置</span>
        </a>
    </nav>

    <!-- Toast -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/static/js/constants.js" defer></script>
    <script src="/static/js/api.js" defer></script>
    <script src="/static/js/state.js" defer></script>
    <script src="/static/js/pages/diary.js" defer></script>
    <script src="/static/js/app.js" defer></script>
    <script>
    (function() {
        if (!localStorage.getItem('token')) {
            window.location.href = '/login';
            return;
        }
        var theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);

        function initDiaryPage() {
            if (!window.App || !window.DiaryApp) {
                setTimeout(initDiaryPage, 50);
                return;
            }
            App._isSPA = false;
            App.token = localStorage.getItem('token');
            App.user = JSON.parse(localStorage.getItem('user') || 'null');
            if (App.applyTheme) App.applyTheme(theme);
            App.init();

            if (!window.diaryApp) {
                window.diaryApp = new DiaryApp();
            }
        }

        initDiaryPage();
    })();
    </script>
</body>
</html>

</html>
